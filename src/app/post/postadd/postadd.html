<form class="needs-validation" novalidate="" [formGroup]="addForm" (ngSubmit)="onSubmit()">
    <div class="mb-3 row">
        <label for="validationCustom01" class="col-sm-2 col-form-label">Title </label>
        <div class="col-sm-10">
            <input type="text" class="form-control" id="validationCustom01" required
                [formControl]="addForm.controls['title']">
            <div class="invalid-feedback">
                Please Enter valid Title.
            </div>
        </div>
    </div>
    <div class="mb-3 row">
        <label for="validationCustom02" class="col-sm-2 col-form-label">Description</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" id="validationCustom02"
                [formControl]="addForm.controls['description']" required>
            <div class="invalid-feedback">
                Please Enter valid Description.
            </div>
        </div>
    </div>
    <div class="col-12">
        <button type="submit" class="mr-auto btn btn-primary">submit</button>
    </div>
</form>
